<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0f1a"/>
      <stop offset="100%" stop-color="#050508"/>
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Spark Outer Gradient -->
    <linearGradient id="sparkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="35%" stop-color="#6366f1"/>
      <stop offset="70%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <!-- Spark Inner Bright Glow -->
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="40%" stop-color="#e0e7ff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>

    <!-- Drop Shadow Filter for Pop -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#6366f1" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- High-Contrast Squircle Badge -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2.5"/>

  <!-- Pilot Sparkle Core Shapes with Outer Glow -->
  <g filter="url(#glow)">
    <!-- Primary 4-Pointed Star -->
    <path d="M32 8 C32 20, 20 32, 8 32 C20 32, 32 44, 32 56 C32 44, 44 32, 56 32 C44 32, 32 20, 32 8 Z" fill="url(#sparkGrad)"/>

    <!-- Diagonal Secondary Star Accent -->
    <path d="M32 18 C32 26, 26 32, 18 32 C26 32, 32 38, 32 46 C32 38, 38 32, 46 32 C38 32, 32 26, 32 18 Z" fill="#ffffff" opacity="0.85"/>
  </g>

  <!-- Luminous Center Core -->
  <circle cx="32" cy="32" r="6" fill="url(#centerGlow)"/>
  <circle cx="32" cy="32" r="3" fill="#ffffff"/>
</svg>
